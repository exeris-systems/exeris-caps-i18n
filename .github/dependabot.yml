version: 2

# GITHUB ACTIONS. `claude.yml` pins its actions by commit SHA with a trailing `# vX.Y.Z` comment,
# which Dependabot rewrites together with the SHA. `build.yml` references its actions by version
# tag, which Dependabot bumps as tags. The reusable workflows in `guardrails.yml` follow the
# organisation's `main`.
#
# MAVEN. The module's whole gate is `mvn verify` on JDK 25 and 26 plus the manifest assertion, and
# every pull request runs exactly that, so a dependency bump is checked by what checks a
# hand-written change. The `eu.exeris:*` pins are ignored: the SDK, kernel and codegen chain are one
# coordinated set that moves by a deliberate change to the POM, and a bot bump of one alone would
# propose a combination nobody validated.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci(actions)"
    labels:
      - dependencies
    groups:
      # One PR for the routine github-owned bumps rather than several, minors and patches only so
      # that a major version travels in a pull request of its own. Third-party actions stay
      # ungrouped: those are the ones worth reading a changelog for before merging.
      github-owned:
        patterns:
          - "actions/*"
          - "github/*"
        update-types:
          - minor
          - patch

  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps)"
    labels:
      - dependencies
    ignore:
      - dependency-name: "eu.exeris:*"
    groups:
      # Minors and patches only, so a major version travels in a pull request of its own.
      test-dependencies:
        patterns:
          - "org.junit.jupiter:*"
          - "org.assertj:*"
        update-types:
          - minor
          - patch
